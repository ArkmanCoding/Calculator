<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0a0a0e" />
<title>ماشین حساب ساده — نسخه مهندسی ادیب</title>
<link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- ===== WATERMARK ===== -->
    <div class="watermark" aria-hidden="true">
      <div class="watermark__text">
        <span class="watermark__line1">شاه کدر ترکمن صحرا</span>
        <span class="watermark__line2">ادیب</span>
        <span class="watermark__meta">TURKMEN SAHRA • ENGINEERING EDITION</span>
      </div>
    </div>

  <div class="calculator simple" dir="ltr">



    <!-- ===== HEADER ===== -->
    <div class="calc-header" dir="rtl" lang="fa">
      <span class="calc-header__title">ماشین حساب ساده</span>
      <span class="calc-header__badge">ENGINEERING • ADIB</span>
    </div>

    <!-- ===== DISPLAY ===== -->
    <div class="calc-display" id="display" role="status" aria-live="polite" aria-atomic="true">0</div>

    <!-- ===== KEYPAD ===== -->
    <div class="calc-grid" role="group" aria-label="دکمه‌های ماشین حساب">

      <!-- Row 1 -->
      <button type="button" id="btn-ac" class="calc-btn"
              data-action="clear" data-value="AC"
              aria-label="پاک کردن همه">AC</button>

      <button type="button" id="btn-negate" class="calc-btn"
              data-action="negate" data-value="±"
              aria-label="تغییر علامت">+/−</button>

      <button type="button" id="btn-percent" class="calc-btn"
              data-action="percent" data-value="%"
              aria-label="درصد">%</button>

      <button type="button" id="btn-divide" class="calc-btn"
              data-action="operator" data-value="/"
              aria-label="تقسیم">÷</button>

      <!-- Row 2 -->
      <button type="button" id="btn-7" class="calc-btn"
              data-action="number" data-value="7">7</button>

      <button type="button" id="btn-8" class="calc-btn"
              data-action="number" data-value="8">8</button>

      <button type="button" id="btn-9" class="calc-btn"
              data-action="number" data-value="9">9</button>

      <button type="button" id="btn-multiply" class="calc-btn"
              data-action="operator" data-value="*"
              aria-label="ضرب">×</button>

      <!-- Row 3 -->
      <button type="button" id="btn-4" class="calc-btn"
              data-action="number" data-value="4">4</button>

      <button type="button" id="btn-5" class="calc-btn"
              data-action="number" data-value="5">5</button>

      <button type="button" id="btn-6" class="calc-btn"
              data-action="number" data-value="6">6</button>

      <button type="button" id="btn-subtract" class="calc-btn"
              data-action="operator" data-value="-"
              aria-label="تفریق">−</button>

      <!-- Row 4 -->
      <button type="button" id="btn-1" class="calc-btn"
              data-action="number" data-value="1">1</button>

      <button type="button" id="btn-2" class="calc-btn"
              data-action="number" data-value="2">2</button>

      <button type="button" id="btn-3" class="calc-btn"
              data-action="number" data-value="3">3</button>

      <button type="button" id="btn-add" class="calc-btn"
              data-action="operator" data-value="+"
              aria-label="جمع">+</button>

      <!-- Row 5 -->
      <button type="button" id="btn-0" class="calc-btn calc-btn--wide"
              data-action="number" data-value="0">0</button>

      <button type="button" id="btn-decimal" class="calc-btn"
              data-action="decimal" data-value="."
              aria-label="اعشار">.</button>

      <button type="button" id="btn-equals" class="calc-btn"
              data-action="equals" data-value="="
              aria-label="مساوی">=</button>

    </div>
  </div>

  <!-- ═══════════════════════════════════════
     MODAL ALERT
     ═══════════════════════════════════════ -->
<div class="alert-modal" id="alertModal">
  <div class="alert-modal__box">

    <div class="alert-modal__icon" id="alertIcon">!</div>

    <div class="alert-modal__text">
      <div class="alert-modal__title" id="alertTitle">خطا</div>
      <div class="alert-modal__message" id="alertMessage">متن پیام</div>
    </div>

    <button class="alert-modal__close" id="alertClose" aria-label="بستن">×</button>

    <div class="alert-modal__timer">
      <div class="alert-modal__timer-bar" id="alertTimerBar"></div>
    </div>

  </div>
</div>

  <script src="script.js"></script>
</body>
</html>
